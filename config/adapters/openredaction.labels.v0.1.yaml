# OpenRedaction 1.1.5 pattern type -> taxonomy type (plan §4.2). The library ships 575 pattern types,
# most of them for other jurisdictions or domains; those not listed become OTHER and are counted.
# Versioned; part of the adapter fingerprint. No PII.
