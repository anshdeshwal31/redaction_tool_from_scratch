# Philter 3.4.1 (Phileas 3.3.0) FilterType -> taxonomy type (plan §4.2). The adapter reads
# explanation.identifiedSpans[].filterType (enum names). Versioned; part of the adapter fingerprint.
# Types not listed become OTHER and are counted. Custom AU identifiers come back as IDENTIFIER without
# their classification, so they map to OTHER. No PII.
version: 0.1.0
map:
  PERSON: PERSON
  PH_EYE: PERSON
  FIRST_NAME: PERSON
  SURNAME: PERSON
  PHYSICIAN_NAME: PERSON
  AGE: AGE
  DATE: DATE
  EMAIL_ADDRESS: EMAIL
  PHONE_NUMBER: PHONE
  PHONE_NUMBER_EXTENSION: PHONE
  URL: URL
  STREET_ADDRESS: ADDRESS
  ZIP_CODE: ADDRESS
  LOCATION_CITY: LOCATION
  LOCATION_COUNTY: LOCATION
  LOCATION_STATE: LOCATION
  STATE_ABBREVIATION: LOCATION
  HOSPITAL: ORGANIZATION
  HOSPITAL_ABBREVIATION: ORGANIZATION
  BANK_ROUTING_NUMBER: ACCOUNT_NUMBER
  CREDIT_CARD: ACCOUNT_NUMBER
  IBAN_CODE: ACCOUNT_NUMBER
  DRIVERS_LICENSE_NUMBER: DRIVER_LICENCE
  PASSPORT_NUMBER: PASSPORT
# IDENTIFIER, SSN, VIN, IP_ADDRESS, MAC_ADDRESS, BITCOIN_ADDRESS, TRACKING_NUMBER, CURRENCY,
# MEDICAL_CONDITION, CUSTOM_DICTIONARY, SECTION -> OTHER
ignore: []
