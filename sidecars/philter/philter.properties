# Philter settings for the local sidecar (plan §11 C1). Loopback inside a --network none container,
# so TLS is off; metrics, caches and remote policy stores stay off. No PII.
server.ssl.enabled=false
server.port=8080
filter.policies.directory=/opt/philter/policies/
filter.policies.service=local
cache.enabled=false
metrics.jmx.enabled=false
metrics.prometheus.enabled=false
metrics.datadog.enabled=false
metrics.cloudwatch.enabled=false
